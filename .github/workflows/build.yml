name: Build CapsQual binaries

on:
  release:
    types: [published]
    
permissions:
  contents: write
  
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller -i "images/logo.ico" --add-data "images/*;images" -w -F main.py
          # Output file is dist/main.exe

      - name: Rename executable
        run: mv dist/main.exe dist/CapsQual_1.6.3.exe
        shell: bash

      - name: Upload artifact (Windows .exe for CI/debug)
        uses: actions/upload-artifact@v4
        with:
          name: CapsQual-Windows-Portable
          path: dist/CapsQual_1.6.3.exe

      - name: Upload Windows exe as release asset
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CapsQual_1.6.3.exe


  build-ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --add-data "images/*:images" -F main.py
          # Output is dist/main

      - name: Rename executable
        run: mv dist/main dist/CapsQual_1.6.3

      - name: Upload artifact (Ubuntu binary for CI/debug)
        uses: actions/upload-artifact@v4
        with:
          name: CapsQual-Ubuntu
          path: dist/CapsQual_1.6.3

      - name: Tar the Ubuntu binary for release
        if: ${{ github.event_name == 'release' }}
        run: tar -czf CapsQual_1.6.3-linux.tar.gz -C dist CapsQual_1.6.3

      - name: Upload Linux tar as release asset
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: CapsQual_1.6.3-linux.tar.gz

  build-macos-intel:
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (macOS)
        run: brew install portaudio

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --icon "images/logo.icns" --add-data "images/*:images" -w --name "CapsQual_1.6.3" main.py
          # Output is dist/CapsQual_1.6.3.app

      - name: Zip .app bundle for release
        run: cd dist && zip -r ../CapsQual_1.6.3-macOS-Intel.zip CapsQual_1.6.3.app

      - name: Upload artifact (macOS Intel .app for CI/debug)
        uses: actions/upload-artifact@v4
        with:
          name: CapsQual-macOS-Intel
          path: dist/CapsQual_1.6.3.app

      - name: Upload macOS .app.zip as release asset
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: CapsQual_1.6.3-macOS-Intel.zip

  build-macos-arm64:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (macOS)
        run: brew install portaudio

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --icon "images/logo.icns" --add-data "images/*:images" -w --name "CapsQual_1.6.3" main.py
          # Output is dist/CapsQual_1.6.3.app

      - name: Zip .app bundle for release
        run: cd dist && zip -r ../CapsQual_1.6.3-macOS-AppleSilicon.zip CapsQual_1.6.3.app

      - name: Upload artifact (macOS ARM .app for CI/debug)
        uses: actions/upload-artifact@v4
        with:
          name: CapsQual-macOS-AppleSilicon
          path: dist/CapsQual_1.6.3.app
          
      - name: Upload macOS .app.zip as release asset
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: CapsQual_1.6.3-macOS-AppleSilicon.zip
