name: Build CapsQual binaries

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller -i "images/logo.ico" --add-data "images/*;images" -w -F main.py
          # Output file is dist/main.exe

      - name: Rename executable
        run: mv dist/main.exe dist/CapsQual_1.5.exe
        shell: bash

      - name: Upload artifact (Windows .exe for CI/debug)
        uses: actions/upload-artifact@v4
        with:
          name: CapsQual-Windows-Portable
          path: dist/CapsQual_1.5.exe

      - name: Upload Windows exe as release asset
        if: ${{ github.event_name == 'release' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/CapsQual_1.5.exe
          asset_name: CapsQual_1.5.exe
          asset_content_type: application/octet-stream

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --add-data "images/*:images" -F main.py
          # Output is dist/main

      - name: Rename executable
        run: mv dist/main dist/CapsQual_1.5

      - name: Upload artifact (Ubuntu binary for CI/debug)
        uses: actions/upload-artifact@v4
        with:
          name: CapsQual-Ubuntu
          path: dist/CapsQual_1.5

      - name: Tar the Ubuntu binary for release
        if: ${{ github.event_name == 'release' }}
        run: tar -czf CapsQual_1.5-linux.tar.gz -C dist CapsQual_1.5

      - name: Upload Linux tar as release asset
        if: ${{ github.event_name == 'release' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: CapsQual_1.5-linux.tar.gz
          asset_name: CapsQual_1.5-linux.tar.gz
          asset_content_type: application/gzip

  build-macos-intel:
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (macOS)
        run: brew install portaudio

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --icon "images/logo.icns" --add-data "images/*:images" -w --name "CapsQual_1.5" main.py
          # Output is dist/CapsQual_1.5.app

      - name: Zip .app bundle for release
        run: cd dist && zip -r ../CapsQual_1.5.app.zip CapsQual_1.5.app

      - name: Upload artifact (macOS Intel .app for CI/debug)
        uses: actions/upload-artifact@v4
        with:
          name: CapsQual-macOS-Intel
          path: dist/CapsQual_1.5.app

      - name: Upload macOS .app.zip as release asset
        if: ${{ github.event_name == 'release' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: CapsQual_1.5.app.zip
          asset_name: CapsQual_1.5-macOS-Intel.zip
          asset_content_type: application/zip

  build-macos-arm64:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (macOS)
        run: brew install portaudio

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --icon "images/logo.icns" --add-data "images/*:images" -w --name "CapsQual_1.5" main.py
          # Output is dist/CapsQual_1.5.app

      - name: Zip .app bundle for release
        run: cd dist && zip -r ../CapsQual_1.5.app.zip CapsQual_1.5.app

      - name: Upload artifact (macOS ARM .app for CI/debug)
        uses: actions/upload-artifact@v4
        with:
          name: CapsQual-macOS-AppleSilicon
          path: dist/CapsQual_1.5.app

      - name: Upload macOS .app.zip as release asset
        if: ${{ github.event_name == 'release' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: CapsQual_1.5.app.zip
          asset_name: CapsQual_1.5-macOS-AppleSilicon.zip
          asset_content_type: application/zip
