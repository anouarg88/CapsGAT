name: Build CapsQual binaries

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller -i "images/logo.ico" --add-data "images/*;images" -w -F main.py
          # The output file is dist/main.exe

      - name: Rename executable
        run: mv dist/main.exe dist/CapsQual_Windows_Portable.exe
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapsQual-Windows
          path: dist/CapsQual_Windows_Portable.exe

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --add-data "images/*:images" -F main.py
          # Output is dist/main

      - name: Rename executable
        run: mv dist/main dist/CapsQual_Ubuntu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapsQual-Ubuntu
          path: dist/CapsQual_Ubuntu

  build-macos-intel:
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --icon "images/logo.icns" --add-data "images/*:images" -w -F main.py
          # Output is dist/main (a macOS executable inside an .app bundle? Actually -F with -w on macOS creates a bundled app, but the executable is inside the .app. We need to locate it.)
          # For a one-file app, PyInstaller creates dist/main (a Unix executable). With -w it still creates a single executable, not an .app bundle. So the output is dist/main.

      - name: Rename executable
        run: mv dist/main dist/CapsQual_MacOS_Intel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapsQual-macOS-Intel
          path: dist/CapsQual_MacOS_Intel

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --icon "images/logo.icns" --add-data "images/*:images" -w -F main.py

      - name: Rename executable
        run: mv dist/main dist/CapsQual_MacOS_Arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapsQual-macOS-AppleSilicon
          path: dist/CapsQual_MacOS_Arm64
