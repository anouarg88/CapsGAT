name: Build CapsQual binaries

on:
  workflow_dispatch:
  release:
    types: [created]
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller -i "images/logo.ico" --add-data "images/*;images" -w -F main.py
          # The output file is dist/main.exe

      - name: Rename executable
        run: mv dist/main.exe dist/CapsQual_1.5.exe
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapsQual-Windows-Portable
          path: dist/CapsQual_1.5.exe

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
                python-version: '3.12'
      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-dev
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --add-data "images/*:images" -F main.py
          # Output is dist/main

      - name: Rename executable
        run: mv dist/main dist/CapsQual_1.5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapsQual-Ubuntu
          path: dist/CapsQual_1.5

  build-macos-intel:
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install system dependencies (macOS)
        run: brew install portaudio
        
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --icon "images/logo.icns" --add-data "images/*:images" -w --name "CapsQual_1.5" main.py

      - name: List dist contents
        run: ls -laR dist || true

      - name: Zip .app bundle
        run: |
          cd dist
          zip -r ../CapsQual_1.5.app.zip CapsQual_1.5.app
                
      - name: Upload .app zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapsQual-macOS-Intel
          path: CapsQual_1.5.app.zip


  build-macos-arm64:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install system dependencies (macOS)
        run: brew install portaudio
        
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --icon "images/logo.icns" --add-data "images/*:images" -w --name "CapsQual_1.5" main.py

      - name: List dist contents
        run: ls -laR dist || true

      - name: Zip .app bundle
        run: |
          cd dist
          zip -r ../CapsQual_1.5.app.zip CapsQual_1.5.app
                
      - name: Upload .app zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapsQual-macOS-AppleSilicon
          path: dist/CapsQual_1.5.app.zip
# Hope this works
