name: Run CI tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow manual trigger for debugging
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install system dependencies for audio and headless GUI testing
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-dev
          # For headless GUI tests (Qt needs a display)
          sudo apt-get install -y xvfb
          sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0 libqt5gui5
          # Additional Qt5 platform plugin support
          sudo apt-get install -y libqt5widgets5 libqt5core5a
          # Fix for QXcbConnection errors
          sudo apt-get install -y libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-qt pytest-timeout
          pip install -r requirements.txt

      # Run tests with xvfb (simulates a display for PyQt5)
      - name: Run pytest with coverage
        run: |
          QT_QPA_PLATFORM=offscreen xvfb-run --auto-servernum python -m pytest --cov=. --cov-report=xml --cov-report=term -v
        env:
          DISPLAY: :99
          QT_DEBUG_PLUGINS: 1

      # Upload coverage report (optional, for integration with codecov)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
